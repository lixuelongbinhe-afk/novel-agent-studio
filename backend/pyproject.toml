[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent-studio-backend"
version = "2.2.11"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.51",
  "alembic>=1.18.5",
  "httpx>=0.28.1",
  "jsonschema>=4.26.0",
  "tiktoken>=0.13.0",
  "pywebview>=6.2.1",
  "pystray>=0.19.5",
  "python-multipart>=0.0.32",
  "python-docx>=1.2.0",
  "pypdf>=6.14.2",
  "reportlab>=5.0.0",
  "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff==0.16.1",
  "mypy>=2.3.0",
  "types-jsonschema>=4.26.0.20260518",
  "types-reportlab>=4.5.1.20260728",
  "pip-audit==2.10.1",
]
packaging = [
  "pyinstaller==6.21.0",
  "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
ignore_missing_imports = true
