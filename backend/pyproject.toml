[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent-studio-backend"
version = "2.2.12"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.0",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2.1.4",
  "alembic>=1.20.0",
  "httpx>=0.28.1",
  "jsonschema>=4.26.0",
  "tiktoken>=0.14.0",
  "pywebview>=6.2.1",
  "pystray>=0.19.5",
  "python-multipart>=0.0.32",
  "python-docx>=1.2.0",
  "pypdf>=6.20.0",
  "reportlab>=5.0.1",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff==0.17.0",
  "mypy>=2.4.0",
  "types-jsonschema>=4.26.0.20261006",
  "types-reportlab>=5.0.0.20261008",
  "pip-audit==2.10.1",
]
packaging = [
  "pyinstaller==6.22.3",
  "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
ignore_missing_imports = true
