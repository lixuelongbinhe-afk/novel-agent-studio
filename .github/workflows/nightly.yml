name: Nightly reliability

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration in minutes
        required: false
        default: "120"

jobs:
  workflow-soak:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - name: Run workflow soak
        shell: pwsh
        run: >-
          ./scripts/run-workflow-soak.ps1
          -Minutes ${{ inputs.minutes || '120' }}
          -Python python
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-soak-report
          path: artifacts/workflow-soak.json
          if-no-files-found: error
          retention-days: 14
