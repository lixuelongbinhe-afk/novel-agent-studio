name: Nightly reliability

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration in minutes
        required: false
        default: "120"

jobs:
  workflow-soak:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - name: Run workflow soak
        shell: pwsh
        run: >-
          ./scripts/run-workflow-soak.ps1
          -Minutes ${{ inputs.minutes || '120' }}
          -Python python
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-soak-report
          path: artifacts/workflow-soak.json
          if-no-files-found: error
          retention-days: 14
