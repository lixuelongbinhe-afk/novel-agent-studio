name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - name: Prepare audit artifacts
        run: New-Item -ItemType Directory -Force artifacts | Out-Null
      - name: Generate backend SBOM
        run: >-
          python -m pip_audit
          --disable-pip
          --requirement requirements.lock
          --format cyclonedx-json
          --output ../artifacts/backend-sbom.cdx.json
        working-directory: backend
      - name: Audit backend dependencies
        run: python -m pip_audit --strict --disable-pip --requirement requirements.lock
        working-directory: backend
      - name: SQLite and workflow concurrency regression
        run: >-
          python -m pytest -q
          tests/test_database_writer.py
          tests/test_workflow_scheduler.py
          tests/test_phase5_workflows.py
          -k "bounded or eight_streaming or cancel or shutdown or forced_process"
        working-directory: backend
      - run: python -m pytest -q --junitxml=../artifacts/backend-junit.xml
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m mypy --strict app tests
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Audit frontend dependencies
        # Temporary client-only React Router RSC exception; see docs/SECURITY.md.
        # Mandatory review date: 2026-10-31. Remove once a compatible fixed release exists.
        run: pnpm audit --audit-level high --ignore GHSA-qwww-vcr4-c8h2
        working-directory: frontend
      - run: pnpm test --run --reporter=junit --outputFile=../artifacts/frontend-junit.xml
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - name: Install Chromium for core E2E
        run: pnpm exec playwright install chromium
        working-directory: frontend
      - name: Run core E2E
        run: pnpm run e2e
        working-directory: frontend
        env:
          NAS_E2E_PYTHON: python
      - run: python scripts/release_metadata.py verify
      - name: Benchmark risk controls
        run: python scripts/benchmark_risk_controls.py --output artifacts/benchmark.json
      - name: Generate audit reports
        run: >-
          python scripts/generate_ci_reports.py
          --backend-junit artifacts/backend-junit.xml
          --frontend-junit artifacts/frontend-junit.xml
          --benchmark artifacts/benchmark.json
          --output-dir docs/generated
      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: |
            artifacts/backend-sbom.cdx.json
            artifacts/backend-junit.xml
            artifacts/frontend-junit.xml
            artifacts/benchmark.json
            frontend/playwright-report/
            frontend/test-results/
            docs/generated/
