name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      # No commercial signing certificate is provisioned yet. Keep this decision explicit;
      # switch to 1 and configure a certificate secret before claiming signed releases.
      NAS_REQUIRE_CODE_SIGNING: "0"
      NAS_SIGN_CERTIFICATE_PATH: ""
      NAS_SIGN_CERTIFICATE_THUMBPRINT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-release.lock
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: python -m venv backend/.venv
      - name: Install locked release dependencies
        run: backend/.venv/Scripts/python.exe -m pip install --require-hashes -r backend/requirements-release.lock
      - name: Prepare release artifacts
        run: New-Item -ItemType Directory -Force ../outputs | Out-Null
      - name: Audit release dependencies
        run: backend/.venv/Scripts/python.exe -m pip_audit --strict --disable-pip --requirement backend/requirements.lock
      - name: Generate release SBOM
        run: >-
          backend/.venv/Scripts/python.exe -m pip_audit
          --disable-pip
          --requirement backend/requirements.lock
          --format cyclonedx-json
          --output ../outputs/backend-sbom.cdx.json
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Temporary client-only React Router RSC exception; see docs/SECURITY.md.
      # Last reviewed: 2026-08-03. Mandatory review date: 2027-01-31.
      # Remove once a compatible fixed release exists.
      - run: pnpm audit --audit-level high --ignore GHSA-qwww-vcr4-c8h2
        working-directory: frontend
      - run: ./scripts/package-desktop.ps1
      - name: Stage release artifacts inside the workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item ../outputs/NovelAgentStudio-Setup-*.exe artifacts/release/
          Copy-Item ../outputs/NovelAgentStudio-Portable-*.zip artifacts/release/
          Copy-Item ../outputs/SHA256SUMS.txt artifacts/release/
          Copy-Item ../outputs/backend-sbom.cdx.json artifacts/release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NovelAgentStudio-${{ github.ref_name }}
          path: |
            artifacts/release/NovelAgentStudio-Setup-*.exe
            artifacts/release/NovelAgentStudio-Portable-*.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/backend-sbom.cdx.json
