name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-release.lock
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: python -m venv backend/.venv
      - name: Install locked release dependencies
        run: backend/.venv/Scripts/python.exe -m pip install --require-hashes -r backend/requirements-release.lock
      - name: Prepare release artifacts
        run: New-Item -ItemType Directory -Force ../outputs | Out-Null
      - name: Audit release dependencies
        run: backend/.venv/Scripts/python.exe -m pip_audit --strict --disable-pip --requirement backend/requirements.lock
      - name: Generate release SBOM
        run: >-
          backend/.venv/Scripts/python.exe -m pip_audit
          --disable-pip
          --requirement backend/requirements.lock
          --format cyclonedx-json
          --output ../outputs/backend-sbom.cdx.json
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level high --ignore GHSA-qwww-vcr4-c8h2
        working-directory: frontend
      - run: ./scripts/package-desktop.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NovelAgentStudio-${{ github.ref_name }}
          path: |
            ../outputs/NovelAgentStudio-Setup-*.exe
            ../outputs/NovelAgentStudio-Portable-*.zip
            ../outputs/SHA256SUMS.txt
            ../outputs/backend-sbom.cdx.json
